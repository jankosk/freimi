[package]
name = "the-frame"
version = "0.1.0"
authors = ["Jan Koskinen <jan@protonmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "the-frame"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"
[dependencies]
log = "0.4"
anyhow = "1"
esp-idf-sys = "0.37"
esp-idf-hal = "0.46"
esp-idf-svc = { version = "0.52", features = [
  "critical-section",
  "embassy-time-driver",
  "embassy-sync",
] }
embedded-graphics = "0.8.2"
tinybmp = "0.6"
epd-waveshare = "0.6.0"

[build-dependencies]
embuild = "0.33"
