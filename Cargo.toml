[package]
name = "freimi"
version = "0.1.0"
authors = ["Jan Koskinen <jan@protonmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "freimi"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"
[dependencies]
log = "0.4"
anyhow = "1"
esp-idf-sys = "0.37"
esp-idf-hal = "0.46"
esp-idf-svc = { version = "0.52", features = ["critical-section"] }
embedded-graphics = "0.8.2"
embedded-hal = "1"
embedded-svc = "0.29"
tinybmp = "0.6"
epd-waveshare = { git = "https://github.com/jankosk/epd-waveshare", default-features = false, features = ["graphics"] }

[build-dependencies]
embuild = "0.33"
